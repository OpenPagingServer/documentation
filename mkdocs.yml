site_name: Open Paging Server
site_url: https://docs.openpagingserver.org

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

  logo: assets/images/logo.png
  favicon: assets/images/logo.png

extra_css:
  - stylesheets/extra.css

nav:
  - Main Website: https://www.openpagingserver.org
  - Welcome to Open Paging Server: index.md
  - Community:
      - Discord: community/discord.md
  - Introduction:
      - Open Paging Server vs Commercial Products: introduction/commercial.md
  - Demo: demo/index.md
  - Users:
      - Web:
          - Supported Web Browsers: user/web/supportedbrowsers.md
  - Administration:
      - Getting Started:
        - Install:
          - Linux (automatic): admin/gettingstarted/install/linux.md
          - Docker: admin/gettingstarted/install/dockercompose.md
          - Linux (manual): admin/gettingstarted/install/linux-man.md
        - First-time setup: admin/gettingstarted/oobe.md
      - Web:
          - Reverse proxies: admin/web/reverseproxy.md
      - Identity:
          - User federation: admin/identity/federation.md
          - Single sign-on:  admin/identity/sso.md
      - Login:
          - Login banner: admin/login/loginmsg.md
      - Messages:
          - Variables: admin/messages/variables.md
          - TTS: admin/messages/tts.md
      - Endpoints:
          - Advanced Network Devices:
             - Overview: admin/endpoints/anetd/overview.md
             - Multicast Paging: admin/endpoints/anetd/multicast.md
             - Visual Text (Scroll): admin/endpoints/anetd/visual.md
          - Asterisk:
            - Overview: admin/endpoints/asterisk/overview.med
          - Avaya:
             - Overview: admin/endpoints/avaya/overview.md
          - Cisco:
              - Overview: admin/endpoints/cisco/index.md
              - Enterprise (UCM/SEP):
                  - Overview: admin/endpoints/cisco/enterprise/index.md
                  - Pre-requisites: admin/endpoints/cisco/enterprise/prerequisites.md
                  - Connecting to CUCM: admin/endpoints/cisco/enterprise/cucm.md
                  - Manually adding phones: admin/endpoints/cisco/enterprise/createmanual.md
                  - Managing existing phones: admin/endpoints/cisco/enterprise/managephones.md
                  - Troubleshooting: admin/endpoints/cisco/enterprise/troubleshooting.md
              - Multiplatform/SPA (SPA/MPP/3PCC/Webex):
                  - Overview: admin/endpoints/cisco/mpp/index.md
                  - Setting up Group Paging: admin/endpoints/cisco/mpp/grouppaging.md
              - Third-party SIP Devices: admin/endpoints/cisco/3psiplua
          - Discord Webhooks:
              - Overview: admin/endpoints/discordwebhooks/overview.md
          - FreePBX:
              - Overview: admin/endpoints/freepbx/overview.md
          - Polycom:
              - Overview: admin/endpoints/polycom/overview.md
site_dir: /var/www/opsdocs

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption